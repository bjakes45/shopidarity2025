<div class="space-y-6">

  <!-- Max Favorites Display -->
  <div class="flex items-center justify-between">
    <label class="text-sm font-medium text-gray-700 flex items-center gap-2">
      <span class="flex items-center gap-1">
        <div class="relative group">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500 hover:text-gray-700" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm-.75-9.5a.75.75 0 011.5 0v4.25a.75.75 0 01-1.5 0V8.5zm.75-3a1 1 0 110 2 1 1 0 010-2z" clip-rule="evenodd" />
          </svg>
          <div class="absolute left-0 mt-1 w-64 bg-gray-800 text-white text-xs rounded px-3 py-2 opacity-0 group-hover:opacity-100 transition-opacity z-10 shadow-lg">
            Gain more Maximum {{t['favorite'] | capitalize}}s by collecting and leveling up your Badges.
          </div>
        </div>
        <span>{{ current_user.favorites | length }} / {{ current_user.max_favorites }} Max {{t['favorite'] | capitalize}}s ❤️</span>
      </span>
    </label>
  </div>

  <!-- Default Alert Setting Toggle -->
  <div class="flex items-center justify-between">
    <label for="defaultAlertToggle" class="text-sm font-medium text-gray-700 flex items-center gap-2">
      <div class="relative group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-500 hover:text-gray-700" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm-.75-9.5a.75.75 0 011.5 0v4.25a.75.75 0 01-1.5 0V8.5zm.75-3a1 1 0 110 2 1 1 0 010-2z" clip-rule="evenodd" />
        </svg>
        <div class="absolute right-0 mt-1 w-64 bg-gray-800 text-white text-xs rounded px-3 py-2 opacity-0 group-hover:opacity-100 transition-opacity z-10 shadow-lg">
          This toggle sets your default preference for receiving alerts on newly {{t['favorite']}}d products.
        </div>
      </div>
      <span>Default Alert Setting</span>
    </label>
    <input type="checkbox" id="defaultAlertToggle"
           {% if current_user.default_fav_alert %}checked{% endif %}
           class="form-checkbox h-5 w-5 text-blue-600 transition duration-150 ease-in-out">
  </div>

  <!-- Deal Distance Input -->
  <div>
    <label for="deal-distance" class="block text-sm font-medium text-gray-700 mb-1">
      Max Deal Distance (km)
    </label>
    <input id="deal-distance" type="number" step="0.1" min="0"
           value="{{ current_user.deal_distance or 10.0 }}"
           class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
    <span id="distance-status" class="text-sm text-green-600 mt-1 hidden">✓ Saved</span>
  </div>

</div>
