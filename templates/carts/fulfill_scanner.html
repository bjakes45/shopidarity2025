{% extends 'base.html' %}
{% block content %}

<div class="max-w-xl mx-auto p-6 bg-white shadow-lg rounded-xl mt-8">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4 flex items-center">
    <i class="fa fa-qrcode text-indigo-600 mr-2"></i>
    Scan Participant QR Code
  </h2>

  <!-- Scanner container -->
  <div id="qr-reader" class="w-full h-64 rounded-lg overflow-hidden"></div>

  <!-- Scan result -->
  <div id="result" class="mt-6 text-center text-lg font-semibold"></div>

  <!-- Return link -->
  <div id="return-link" class="mt-4 text-center hidden">
    <a href="{{ url_for('cart_detail', cart_id=share.cart_id) }}"
       class="inline-block px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">
      ⬅ Return to Collective Cart
    </a>
  </div>

  <p class="text-sm text-gray-500 mt-3 text-center">
    Align the QR code within the frame to fulfill the participant’s share.
  </p>

    <a href="{{ url_for('cart_detail', cart_id=share.cart.id) }}" class="text-blue-600 hover:underline">
    Back to Collective Cart
  </a>
</div>

<!-- html5-qrcode library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

<script>
  const expectedShareId = {{ expected_share_id }};
  const cartId = {{ share.cart_id }};
  const resultEl = document.getElementById('result');
  const returnLink = document.getElementById('return-link');

  function showMessage(msg, isSuccess) {
    resultEl.textContent = msg;
    resultEl.className = `mt-6 text-center text-lg font-semibold ${
      isSuccess ? 'text-green-600' : 'text-red-600'
    }`;

    if (isSuccess) {
      returnLink.classList.remove('hidden');
    }
  }

  const html5QrCode = new Html5Qrcode("qr-reader");

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: { width: 350, height: 350 }
    },
    (decodedText, decodedResult) => {
      // stop scanning after successful read
      html5QrCode.stop();
      fetch("/fulfill_share", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token() }}"  // include if CSRF is used
        },
        body: JSON.stringify({
          scanned_token: decodedText,
          expected_share_id: expectedShareId
        })
      })
      .then(res => res.json())
      .then(data => showMessage(data.message, data.success))
      .catch(() => showMessage("Scan error occurred", false));
    },
    errorMessage => {
      // console.log("QR Scan Error", errorMessage); // Optional: debug output
    }
  ).catch(err => {
    showMessage("Camera access denied or scanner error", false);
  });
</script>

{% endblock %}
