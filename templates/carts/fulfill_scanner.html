{% extends 'base.html' %}
{% block content %}

<div class="max-w-xl mx-auto p-6 bg-white shadow-lg rounded-xl mt-8">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4 flex items-center">
    <i class="fa fa-qrcode text-indigo-600 mr-2"></i>
    Scan Participant QR Code
  </h2>

  <!-- Scanner container -->
  <div class="relative w-full h-64 bg-black rounded-lg overflow-hidden">
    <video id="preview" class="absolute inset-0 w-full h-full object-cover z-0" autoplay muted playsinline></video>

    <!-- Frame overlay -->
    <div class="absolute inset-0 z-10 pointer-events-none flex justify-center items-center">
      <div class="w-48 h-48 border-4 border-indigo-500 rounded-lg animate-pulse"></div>
    </div>
  </div>

  <!-- Scan result -->
  <div id="result" class="mt-6 text-center text-lg font-semibold"></div>

  <!-- Return link -->
  <div id="return-link" class="mt-4 text-center hidden">
    <a href="{{ url_for('cart_detail', cart_id=share.cart_id) }}"
       class="inline-block px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">
      ⬅ Return to Collective Cart
    </a>
  </div>

  <p class="text-sm text-gray-500 mt-3 text-center">
    Align the QR code within the frame to fulfill the participant’s share.
  </p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
  const expectedShareId = {{ expected_share_id }};
  const cartId = {{ share.cart_id }};
  const video = document.getElementById('preview');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let hasScanned = false;

  function showMessage(msg, isSuccess) {
    const resultEl = document.getElementById('result');
    resultEl.textContent = msg;
    resultEl.className = `mt-6 text-center text-lg font-semibold ${
      isSuccess ? 'text-green-600' : 'text-red-600'
    }`;

    if (isSuccess) {
      document.getElementById('return-link').classList.remove('hidden');
    }
  }

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => {
      video.srcObject = stream;
      video.play();
      requestAnimationFrame(tick);
    })
    .catch(() => showMessage("Camera access denied", false));

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);

      if (code && !hasScanned) {
        hasScanned = true;
        fetch('/fulfill_share', {
          method: 'POST',
          headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': "{{ csrf_token() }}"
        },
          body: JSON.stringify({
            scanned_share_id: code.data,
            expected_share_id: expectedShareId
          })
        })
        .then(res => res.json())
        .then(data => showMessage(data.message, data.success))
        .catch(() => showMessage("Scan error occurred", false));
      }
    }
    if (!hasScanned) requestAnimationFrame(tick);
  }
</script>

{% endblock %}
